[package]
name = "hpulse-input"
version = "0.1.0"
edition = "2021"
description = "H-Pulse HPU-2: Deterministic StandardizedInput normalizer & validator (WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
